<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ShopSphere</title><style>
body{font-family:system-ui,sans-serif;background:#f5f7fb;color:#142236;max-width:1120px;margin:0 auto;padding:30px}header{display:flex;justify-content:space-between;align-items:center}h1{margin:0}main{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-top:24px}.panel{background:white;padding:20px;border-radius:14px;border:1px solid #dce3ed}.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}.item{padding:15px;border:1px solid #dce3ed;border-radius:10px}button{background:#136ef6;border:0;color:white;padding:9px 13px;border-radius:7px;cursor:pointer}button:disabled{opacity:.5;cursor:default}li{margin:8px 0}.status{margin:12px 0;min-height:1.4em}small{color:#576579}@media(max-width:750px){main{grid-template-columns:1fr}} </style></head><body>
<header><div><h1>ShopSphere</h1><small>Project-first Kubernetes lab · customer demo</small></div><button id="refresh">Refresh</button></header><div id="status" class="status" role="status"></div>
<main><section class="panel"><h2>Products</h2><div id="products" class="products"></div></section><aside><section class="panel"><h2>Your cart</h2><ul id="cart"></ul><p id="total"></p><button id="checkout">Checkout</button></section><section class="panel" style="margin-top:20px"><h2>Orders</h2><ul id="orders"></ul></section></aside></main>
<script>
const customer='demo'; let catalog=[],busy=false;
const $=id=>document.getElementById(id);
function message(s){$('status').textContent=s}
async function api(path,opts={}){const r=await fetch(path,opts);let body;try{body=await r.json()}catch{body={}}if(!r.ok)throw new Error(body.error||`HTTP ${r.status}`);return body}
function node(tag,text){const el=document.createElement(tag);el.textContent=text;return el}
async function load(){try{const [p,c,o]=await Promise.all([api('/api/products'),api('/api/carts/'+customer),api('/api/orders/'+customer)]); catalog=p; $('products').replaceChildren();p.forEach(product=>{const card=node('div','');card.className='item';card.append(node('h3',product.name),node('p','₹'+product.price));const add=node('button','Add to cart');add.onclick=()=>addItem(product.id);card.append(add);$('products').append(card)});$('cart').replaceChildren();let total=0;c.items.forEach(it=>{const prod=catalog.find(p=>p.id===it.product_id);total+=(prod?.price||0)*it.quantity;$('cart').append(node('li',`${prod?.name||it.product_id} × ${it.quantity}`))});$('total').textContent=`Estimated total ₹${total}`;$('orders').replaceChildren();o.orders.slice().reverse().forEach(x=>$('orders').append(node('li',`Order #${x.id} · ₹${x.total_price}`)));}catch(e){message('Load failed: '+e.message)}}
async function addItem(id){try{await api('/api/carts/'+customer+'/items',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({product_id:id,quantity:1})});message('Added to cart');await load()}catch(e){message(e.message)}}
async function checkout(){if(busy)return;busy=true;$('checkout').disabled=true;let key=sessionStorage.getItem('pendingCheckoutKey');if(!key){key=crypto.randomUUID();sessionStorage.setItem('pendingCheckoutKey',key)}try{const result=await api('/api/orders/'+customer,{method:'POST',headers:{'Idempotency-Key':key}});message(`Order #${result.order_id} saved. `+(result.cart_cleared===false?'Cart cleanup needs review.':result.replayed?'Repeated request returned existing order.':'Checkout completed.'));sessionStorage.removeItem('pendingCheckoutKey');await load()}catch(e){message('Checkout uncertain or failed: '+e.message+'. Retry uses the SAME key.')}finally{busy=false;$('checkout').disabled=false}}
$('checkout').onclick=checkout;$('refresh').onclick=load;load();
</script></body></html>
