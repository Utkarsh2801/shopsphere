server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    location = /api/products { proxy_pass http://product-service:5000/api/products; }
    location /api/carts/ { proxy_pass http://cart-service:8001/carts/; }
    location /api/orders/ { proxy_pass http://order-service:8002/orders/; }
    location / { try_files $uri $uri/ /index.html; }
}
