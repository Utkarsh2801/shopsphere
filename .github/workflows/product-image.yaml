
name: Build Product API

concurrency:
  group: product-image-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [main]
    paths:
      - "product-service/**"
      - ".github/workflows/product-image.yaml"

  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Python syntax
        run: |
          python -m py_compile product-service/app.py

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image owner
        id: image
        run: echo "owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: ./product-service
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.owner }}/shopsphere-product:sha-${{ github.sha }}
            ghcr.io/${{ steps.image.outputs.owner }}/shopsphere-product:main

      - name: Update Helm image tag
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          values_file = Path("helm/shopsphere-api/values.yaml")
          lines = values_file.read_text().splitlines(keepends=True)
          tag_lines = [index for index, line in enumerate(lines) if line.startswith("  tag: ")]
          if len(tag_lines) != 1:
              raise SystemExit("Expected exactly one Helm image tag")

          lines[tag_lines[0]] = f"  tag: {os.environ['IMAGE_TAG']}\n"
          values_file.write_text("".join(lines))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/shopsphere-api/values.yaml
          if git diff --cached --quiet; then
            echo "Helm image tag is already up to date"
            exit 0
          fi
          git commit -m "Deploy product image ${IMAGE_TAG}"
          git push
