apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: product-api
  namespace: shopsphere
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - shopsphere
  selector:
    matchLabels:
      app: product-metrics
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s