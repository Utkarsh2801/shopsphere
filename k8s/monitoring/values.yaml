grafana:
  adminPassword: "shopsphere-local-lab-only"
  service:
    type: ClusterIP

alertmanager:
  enabled: false

prometheus:
  prometheusSpec:
    retention: 6h
    retentionSize: "1GB"
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - monitoring
            - shopsphere
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        memory: 1Gi
