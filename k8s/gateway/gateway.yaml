apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shopsphere-gateway
  namespace: shopsphere
spec:
  gatewayClassName: shopsphere-gateway-class
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: shopsphere.test
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: shopsphere.test
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: shopsphere-tls
      allowedRoutes:
        namespaces:
          from: Same