apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-allow-apis
  namespace: shopsphere
spec:
  podSelector:
    matchLabels:
      app: postgres

  policyTypes:
    - Ingress

  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: product-service
        - podSelector:
            matchLabels:
              app: cart-service
        - podSelector:
            matchLabels:
              app: order-service
        - podSelector:
            matchExpressions:
              - key: batch.kubernetes.io/job-name
                operator: In
                values:
                  - cart-order-schema-v1
                  - checkout-schema-v1
      ports:
        - protocol: TCP
          port: 5432
